name: Refresh Gemini Market Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3-12 * * 1-5"
    - cron: "30 4 * * 0,6"

permissions:
  contents: write

concurrency:
  group: gemini-market-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
    steps:
      - uses: actions/checkout@v4

      # Runs with or without GEMINI_API_KEY: the generator falls back to free
      # RSS headlines (deterministic ranking) when Gemini is unavailable, and
      # upgrades to grounded Gemini automatically when a billed key is present.
      - name: Generate market intelligence
        run: node scripts/generate-market-intelligence.mjs

      - name: Publish refreshed feed
        shell: bash
        run: |
          git config user.name "alpha-swing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/market-intelligence.json
          if git diff --cached --quiet; then
            echo "No market-intelligence changes to publish."
            exit 0
          fi
          git commit -m "Refresh market intelligence"
          git pull --rebase origin main
          git push origin HEAD:main
