name: Refresh Gemini Market Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3-12 * * 1-5"
    - cron: "30 4 * * 0,6"

permissions:
  contents: write

concurrency:
  group: gemini-market-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
    steps:
      - uses: actions/checkout@v4

      - name: Check Gemini configuration
        id: gemini
        shell: bash
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GEMINI_API_KEY is not configured; keeping the existing feed."
          fi

      - name: Generate grounded market intelligence
        if: steps.gemini.outputs.configured == 'true'
        run: node scripts/generate-market-intelligence.mjs

      - name: Publish refreshed feed
        if: steps.gemini.outputs.configured == 'true'
        shell: bash
        run: |
          git config user.name "alpha-swing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/market-intelligence.json
          if git diff --cached --quiet; then
            echo "No market-intelligence changes to publish."
            exit 0
          fi
          git commit -m "Refresh Gemini market intelligence"
          git pull --rebase origin main
          git push origin HEAD:main
