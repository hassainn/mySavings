name: Run NSE Agentic Scan

on:
  workflow_dispatch:
    inputs:
      partition:
        description: "Which universe slice(s) to scan"
        required: true
        default: "both"
        type: choice
        options:
          - "both"
          - "0"
          - "1"
  schedule:
    # ONE daily run that scans both slices back-to-back, so it lands well before
    # 9 PM IST. GitHub delays scheduled workflows by hours at busy UTC minutes, so
    # this fires early (11:10 UTC = 16:40 IST, ~1h after the 15:30 IST close once
    # EOD candles have settled). Even with a 3-4h GitHub delay the merged scan
    # publishes by ~8-8:30 PM IST. A single job removes the old two-cron rebase
    # race that failed one slice most days. Weekends simply re-stamp Friday's close.
    - cron: "10 11 * * *"

permissions:
  contents: write

concurrency:
  group: nse-agentic-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      MAX_INSTRUMENTS: "1850"
      UPSTOX_REQUEST_SPACING_MS: "135"
      PARTITION_COUNT: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Check Upstox configuration
        id: upstox
        shell: bash
        run: |
          if [ -n "$UPSTOX_ACCESS_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "UPSTOX_ACCESS_TOKEN is not configured; keeping the existing scan."
          fi

      - name: Scan NSE cash universe (both slices)
        if: steps.upstox.outputs.configured == 'true'
        shell: bash
        run: |
          SEL="both"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SEL="${{ inputs.partition }}"
          fi
          echo "Scanning selection: $SEL"
          if [ "$SEL" = "both" ] || [ "$SEL" = "0" ]; then
            echo "::group::Partition 0/2"
            PARTITION_INDEX=0 node scripts/scan-upstox-universe.mjs
            echo "::endgroup::"
          fi
          if [ "$SEL" = "both" ] || [ "$SEL" = "1" ]; then
            echo "::group::Partition 1/2"
            PARTITION_INDEX=1 node scripts/scan-upstox-universe.mjs
            echo "::endgroup::"
          fi

      - name: Publish ranked signals
        if: steps.upstox.outputs.configured == 'true'
        shell: bash
        run: |
          git config user.name "alpha-swing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/scanner-results.json docs/data/scanner-results-part-*.json
          if git diff --cached --quiet; then
            echo "No scanner changes to publish."
            exit 0
          fi
          git commit -m "Refresh NSE agentic scan"
          # Retry against a moving main (strategist/news/fundamentals also push);
          # -X ours keeps our freshly generated scan on any data-file conflict.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X ours origin main && git push origin HEAD:main; then
              echo "Published on attempt $attempt."
              exit 0
            fi
            echo "Publish attempt $attempt failed; re-syncing and retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 7
          done
          echo "Failed to publish scanner results after retries."
          exit 1
