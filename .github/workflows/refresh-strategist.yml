name: Refresh AI Strategist

on:
  workflow_dispatch:
  schedule:
    - cron: "45 2 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "45 4 * * 0,6"
  workflow_run:
    workflows: [Run NSE Agentic Scan, Refresh Gemini Market Intelligence]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ai-strategist
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic gates
        run: node --test tests/strategist.test.mjs
      - name: Generate daily plan and memory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: node scripts/generate-strategist-plan.mjs
      - name: Save plan and bounded memory
        run: |
          git config user.name "alpha-swing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/strategist-plan.json docs/data/strategist-memory.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh daily strategist plan and memory"
          git pull --rebase origin main
          git push origin HEAD:main
