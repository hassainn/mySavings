<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Alpha Swing AI</title>
    <meta name="theme-color" content="#f3f7f5" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      :root {
        --bg: #0e1722;
        --side: #09111a;
        --card: #152232;
        --line: #2b4059;
        --gold: #dfb65f;
        --ink: #ecf2fb;
        --muted: #91a6c0;
        --green: #5ed0a4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px Arial,
          sans-serif;
      }
      .app {
        display: flex;
        min-height: 100vh;
      }
      .side {
        width: 250px;
        background: var(--side);
        border-right: 1px solid var(--line);
        padding: 25px 14px;
      }
      .brand {
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 2px;
        color: #fff;
        padding: 8px;
      }
      .brand b {
        color: var(--gold);
      }
      .side p {
        font-size: 11px;
        letter-spacing: 2px;
        color: var(--muted);
        margin: 42px 8px 10px;
      }
      .nav {
        width: 100%;
        background: none;
        border: 0;
        color: #a9bdd3;
        text-align: left;
        padding: 13px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
      }
      .nav:hover,
      .nav.active {
        background: #203249;
        color: #fff;
        box-shadow: inset 2px 0 var(--gold);
      }
      .main {
        flex: 1;
        min-width: 0;
      }
      .top {
        height: 82px;
        border-bottom: 1px solid var(--line);
        padding: 0 45px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .status {
        color: var(--gold);
        font-family: monospace;
      }
      .status span {
        color: var(--muted);
        margin-left: 12px;
      }
      .avatar {
        background: #315778;
        border-radius: 50%;
        width: 39px;
        height: 39px;
        display: grid;
        place-items: center;
        font-weight: bold;
      }
      .wrap {
        max-width: 1500px;
        margin: auto;
        padding: 38px 45px 85px;
      }
      .title {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 28px;
      }
      .title small,
      .eyebrow {
        color: #94aaca;
        letter-spacing: 2px;
        font-size: 10px;
      }
      .title h1 {
        font:
          600 42px Georgia,
          serif;
        margin: 8px 0 0;
      }
      .btn {
        background: var(--gold);
        border: 0;
        border-radius: 6px;
        padding: 12px 16px;
        font-weight: bold;
        color: #101923;
        cursor: pointer;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 20px;
      }
      .verdict {
        display: flex;
        gap: 34px;
        align-items: center;
      }
      .gate {
        padding-right: 34px;
        border-right: 1px solid var(--line);
        min-width: 165px;
      }
      .gate b {
        display: block;
        color: var(--gold);
        font: 18px monospace;
        margin: 8px 0;
      }
      .gate span {
        color: var(--muted);
      }
      h2 {
        font-size: 18px;
        margin: 6px 0;
      }
      h3 {
        font:
          24px Georgia,
          serif;
        margin: 5px 0;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin: 18px 0;
      }
      .metric {
        border-top: 2px solid #5288be;
      }
      .metric b {
        display: block;
        font:
          36px Georgia,
          serif;
        margin: 8px 0;
      }
      .metric span {
        color: var(--muted);
        font-size: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 315px;
        gap: 17px;
      }
      .rows {
        margin: 16px -20px -20px;
      }
      .row {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 0.5fr;
        gap: 12px;
        padding: 15px 20px;
        border-top: 1px solid var(--line);
        align-items: center;
      }
      .row small,
      .muted {
        color: var(--muted);
      }
      .up {
        color: var(--green);
      }
      .score {
        text-align: center;
        border: 5px solid #4c85a9;
        border-top-color: var(--gold);
        border-radius: 50%;
        width: 104px;
        height: 104px;
        margin: 20px auto;
        display: grid;
        place-content: center;
        font: 37px Georgia;
      }
      .quality {
        display: grid;
        gap: 11px;
      }
      .quality div {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
      }
      .quality b {
        color: white;
      }
      .watch {
        margin-top: 18px;
      }
      .watchrow {
        display: grid;
        grid-template-columns: 2fr 1fr auto;
        gap: 12px;
        padding: 14px 0;
        border-top: 1px solid var(--line);
        align-items: center;
      }
      .watchrow label {
        color: #a8cef7;
      }
      .remove {
        background: none;
        border: 1px solid #86535c;
        color: #f4a1a8;
        border-radius: 4px;
        padding: 7px;
        cursor: pointer;
      }
      .notice {
        padding: 12px;
        margin: 12px 0;
        border: 1px solid #476580;
        border-radius: 5px;
        background: #182b3e;
        color: #bbd5f1;
      }
      .settings input {
        display: block;
        width: 100%;
        margin: 8px 0 16px;
        padding: 11px;
        background: #0d1620;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: white;
      }
      .hidden {
        display: none;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        margin: 14px 0;
      }
      .toolbar input,
      .field {
        width: 100%;
        padding: 11px;
        background: #0d1620;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: white;
      }
      .mini {
        border: 1px solid #46617e;
        background: transparent;
        color: #b9cee5;
        border-radius: 4px;
        padding: 7px 9px;
        cursor: pointer;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: #05090fbb;
        display: none;
        place-items: center;
        z-index: 20;
        padding: 16px;
      }
      .modal.open {
        display: grid;
      }
      .dialog {
        width: min(480px, 100%);
        background: #152232;
        border: 1px solid #49627e;
        border-radius: 9px;
        padding: 22px;
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
      }
      .dialog-head button {
        background: none;
        border: 0;
        color: white;
        font-size: 22px;
      }
      .dialog label {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin: 12px 0 5px;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }
      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        background: #20364c;
        border: 1px solid #4b6b8b;
        padding: 12px 16px;
        border-radius: 6px;
        display: none;
        z-index: 30;
      }
      .toast.show {
        display: block;
      }
      .risk-result {
        margin-top: 15px;
        padding: 14px;
        background: #0e1925;
        border-radius: 6px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .risk-result span {
        color: var(--muted);
        font-size: 12px;
      }
      .risk-result b {
        display: block;
        color: white;
        margin-top: 3px;
      }
      .danger {
        color: #f2a1a8;
      }
      .watchrow input[type="number"] {
        width: 100px;
        padding: 7px;
        background: #0d1620;
        border: 1px solid var(--line);
        color: white;
        border-radius: 4px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .form-grid label {
        color: var(--muted);
        font-size: 12px;
      }
      .form-grid input,
      .form-grid select,
      .form-grid textarea {
        display: block;
        width: 100%;
        margin-top: 5px;
        padding: 10px;
        background: #0d1620;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: white;
      }
      .form-grid textarea {
        min-height: 85px;
      }
      .full {
        grid-column: 1/-1;
      }
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 14px 0;
      }
      .kpi {
        padding: 15px;
        background: #0f1b28;
        border-radius: 6px;
      }
      .kpi b {
        display: block;
        font-size: 24px;
        margin-top: 5px;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 14px;
      }
      .table th,
      .table td {
        text-align: left;
        border-top: 1px solid var(--line);
        padding: 12px 8px;
      }
      .table th {
        color: var(--muted);
        font-size: 11px;
      }
      .pill {
        padding: 4px 7px;
        border-radius: 4px;
        background: #243d56;
        color: #abd4ff;
        font-size: 11px;
      }
      .file {
        padding: 18px;
        border: 1px dashed #49627e;
        border-radius: 7px;
        text-align: center;
      }
      .positive {
        color: var(--green);
      }
      .mobile {
        display: none;
      }
      @media (max-width: 720px) {
        .side {
          display: none;
        }
        .top {
          height: 62px;
          padding: 0 18px;
        }
        .wrap {
          padding: 25px 15px 75px;
        }
        .title h1 {
          font-size: 34px;
        }
        .metrics {
          grid-template-columns: repeat(2, 1fr);
          gap: 9px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .focus {
          display: none;
        }
        .verdict {
          display: block;
        }
        .gate {
          border: 0;
          border-bottom: 1px solid var(--line);
          padding-bottom: 12px;
          margin-bottom: 14px;
        }
        .row {
          grid-template-columns: 2fr 1fr;
        }
        .row > :nth-child(3),
        .row > :nth-child(4) {
          display: none;
        }
        .watchrow {
          grid-template-columns: 1fr auto;
        }
        .watchrow label {
          grid-column: 1;
        }
        .watchrow button {
          grid-column: 2;
          grid-row: 1/3;
        }
        .form-grid,
        .kpi-grid {
          grid-template-columns: 1fr;
        }
        .table {
          font-size: 12px;
        }
        .table th:nth-child(3),
        .table td:nth-child(3) {
          display: none;
        }
        .mobile {
          display: flex;
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          height: 62px;
          background: var(--side);
          border-top: 1px solid var(--line);
          justify-content: space-around;
          overflow-x: auto;
        }
        .mobile button {
          border: 0;
          background: none;
          color: var(--muted);
          font-size: 11px;
          min-width: 76px;
        }
        .mobile button.active {
          color: var(--gold);
        }
      }
    </style>
    <style id="mint-mobile-redesign">
      :root {

        display: flex;
        min-width: 0;
        align-items: center;
        gap: 12px;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .stock-line {
        position: absolute;
        right: 12px;
        bottom: 12px;
        width: 48%;
      }
      .stock-price {
        color: var(--ink);
        font-size: 15px;
        font-weight: 800;
      }
      .up,
      .positive {
        color: var(--mint-dark) !important;
      }
      .down {
        color: var(--rose) !important;
      }
      .market-pulse {
        min-height: 100%;
        padding: 22px;
      }
      .pulse-ring {
        display: grid;
        width: 132px;
        height: 132px;
        margin: 18px auto;
        place-items: center;
        border-radius: 50%;
        background: conic-gradient(var(--mint) 0 76%, #ecf2ef 76% 100%);
      }
      .pulse-ring::before {
        content: "76";
        display: grid;
        width: 104px;
        height: 104px;
        place-items: center;
        border-radius: 50%;
        background: #fff;
        color: var(--ink);
        font-size: 34px;
        font-weight: 850;
      }
      .pulse-copy {
        color: var(--muted);
        text-align: center;
        font-size: 13px;
      }
      .rows {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
      }
      .row {
        min-height: 78px;
        border-bottom: 1px solid var(--line);
        color: var(--ink);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row small,
      .muted {
        color: var(--muted);
      }
      .notice,
      .pill {
        border: 0;
        border-radius: 999px;
        background: var(--mint-soft);
        color: var(--mint-dark);
      }
      .metrics,
      .kpi-grid {
        gap: 14px;
      }
      .metric,
      .kpi {
        border-top: 0;
      }
      .metric > b,
      .kpi > b {
        color: var(--ink);
        font-family: inherit;
        font-weight: 850;
      }
      .verdict {
        align-items: center;
        background: #fff;
      }
      .gate {
        border-right-color: var(--line);
      }
      .gate b {
        color: #f0a733;
      }
      .watchrow {
        border-bottom-color: var(--line);
      }
      input,
      select,
      textarea,
      .toolbar input,
      .settings input,
      .field {
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: #f9fbfa;
        color: var(--ink);
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--mint);
        background: #fff;
      }
      .form-grid input,
      .form-grid select,
      .form-grid textarea {
        border: 1px solid var(--line);
        background: #f9fbfa;
        color: var(--ink);
      }
      .table th {
        color: var(--muted);
      }
      .table td,
      .table th {
        border-bottom-color: var(--line);
      }
      .file {
        border-color: #bfeede;
        background: var(--mint-soft);
      }
      .modal {
        background: rgba(9, 31, 24, 0.45);
        backdrop-filter: blur(8px);
      }
      .dialog {
        border: 0;
        border-radius: 24px;
        background: #fff;
        color: var(--ink);
        box-shadow: 0 34px 100px rgba(8, 45, 33, 0.28);
      }
      .dialog-head {
        border-bottom-color: var(--line);
      }
      .dialog-head button {
        color: var(--muted);
      }
      .risk-result span {
        border-color: var(--line);
        background: #f7faf8;
      }
      .toast {
        border: 0;
        border-radius: 14px;
        background: var(--navy);
        color: #fff;
        box-shadow: 0 18px 45px rgba(7, 35, 27, 0.25);
      }
      .mobile-menu {
        display: none;
      }
      .detail-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
        gap: 20px;
      }
      .detail-chart {
        padding: 24px;
      }
      .detail-price {
        margin: 18px 0 3px;
        font-size: clamp(34px, 5vw, 52px);
        font-weight: 850;
        letter-spacing: -0.05em;
      }
      .range-tabs {
        display: flex;
        gap: 8px;
        margin: 20px 0;
      }
      .range-tabs button {
        width: 42px;
        height: 34px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }
      .range-tabs button.active {
        background: var(--mint);
        color: #074431;
      }
      .chart-canvas {
        width: 100%;
        min-height: 260px;
      }
      .detail-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }
      .detail-aside {
        padding: 22px;
      }
      .quality-list {
        display: grid;
        gap: 9px;
      }
      .quality-list div {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
      }
      .quality-list b {
        color: var(--ink);
      }
      @media (max-width: 980px) {
        .side {
          width: 210px;
        }
        .overview-grid,
        .detail-layout {
          grid-template-columns: 1fr;
        }
        .market-pulse {
          min-height: 270px;
        }
      }
      @media (max-width: 760px) {
        body {
          background: #f2f7f4;
        }
        .side {
          display: none;
        }
        .top {
          height: 64px;
          padding: 0 18px;
          background: rgba(255, 255, 255, 0.9);
        }
        .status {
          font-size: 0;
        }
        .status::after {
          content: "Alpha Swing";
          color: var(--ink);
          font-size: 17px;
          font-weight: 850;
          letter-spacing: -0.03em;
        }
        .wrap {
          padding: 22px 16px 112px;
        }
        .title {
          margin-bottom: 18px;
        }
        .title small {
          display: none;
        }
        .title h1 {
          font-size: 27px;
        }
        .title .btn {
          min-height: 40px;
          padding: 0 14px;
          font-size: 13px;
        }
        .portfolio-hero {
          min-height: 300px;
          margin: 0 -4px;
          padding: 24px 20px;
          border-radius: 25px;
        }
        .portfolio-value {
          display: block;
          margin: 28px 0 24px;
        }
        .portfolio-value strong {
          display: block;
          font-size: 39px;
        }
        .portfolio-value span {
          display: inline-block;
          margin-top: 8px;
        }
        .portfolio-stats {
          grid-template-columns: 1fr 1fr;
        }
        .portfolio-stats div:last-child {
          display: none;
        }
        .hero-line {
          right: -25px;
          bottom: 15px;
          min-width: 230px;
          width: 55%;
          opacity: 0.42;
        }
        .overview-grid {
          display: block;
        }
        .setup-strip {
          display: flex;
          overflow-x: auto;
          margin: 0 -16px;
          padding: 4px 16px 18px;
          scroll-snap-type: x mandatory;
          scrollbar-width: none;
        }
        .setup-strip::-webkit-scrollbar {
          display: none;
        }
        .setup-card {
          min-width: 190px;
          scroll-snap-align: start;
        }
        .market-pulse {
          display: none;
        }
        .card {
          border-radius: 18px;
          box-shadow: 0 12px 32px rgba(25, 72, 57, 0.065);
        }
        .mobile {
          position: fixed;
          z-index: 40;
          right: 10px;
          bottom: 10px;
          left: 10px;
          display: grid;
          height: 70px;
          grid-template-columns: repeat(5, 1fr);
          padding: 7px;
          border: 1px solid rgba(221, 232, 226, 0.95);
          border-radius: 22px;
          background: rgba(255, 255, 255, 0.95);
          box-shadow: 0 18px 55px rgba(12, 46, 36, 0.16);
          backdrop-filter: blur(18px);
        }
        .mobile button {
          display: grid;
          min-width: 0;
          place-items: center;
          align-content: center;
          gap: 2px;
          border: 0;
          border-radius: 15px;
          background: transparent;
          color: #8a9a94;
          font-size: 17px;
        }
        .mobile button span {
          display: block;
          font-size: 10px;
          font-weight: 750;
        }
        .mobile button.active {
          background: var(--mint-soft);
          color: var(--mint-dark);
        }
        .mobile-menu {
          position: fixed;
          z-index: 35;
          right: 16px;
          bottom: 90px;
          left: 16px;
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 9px;
          padding: 14px;
          border: 1px solid var(--line);
          border-radius: 22px;
          background: rgba(255, 255, 255, 0.98);
          box-shadow: 0 24px 70px rgba(7, 37, 28, 0.2);
          transform: translateY(20px);
          opacity: 0;
          pointer-events: none;
          transition: 180ms ease;
        }
        .mobile-menu.open {
          transform: translateY(0);
          opacity: 1;
          pointer-events: auto;
        }
        .mobile-menu button {
          min-height: 48px;
          border: 0;
          border-radius: 14px;
          background: #f5f9f7;
          color: var(--ink);
          font-weight: 700;
        }
        .metrics,
        .kpi-grid {
          grid-template-columns: 1fr 1fr;
        }
        .grid,
        .form-grid,
        .risk-result {
          grid-template-columns: 1fr;
        }
        .row {
          grid-template-columns: minmax(0, 1.2fr) auto auto;
          gap: 9px;
          padding: 14px;
        }
        .row > div:nth-child(3) {
          display: none;
        }
        .watchrow {
          grid-template-columns: 1fr auto;
        }
        .watchrow label {
          grid-column: 1 / -1;
          order: 3;
        }
        .table {
          display: block;
          overflow-x: auto;
          white-space: nowrap;
        }
        .detail-chart,
        .detail-aside {
          padding: 18px;
        }
        .chart-canvas {
          min-height: 220px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">

    </div>
    <div class="modal" id="stockModal">
      <form class="dialog" id="stockForm">
        <div class="dialog-head">
          <h3>Add stock</h3>
          <button type="button" onclick="closeModal('stockModal')">×</button>
        </div>
        <label for="symbol">NSE symbol</label
        ><input
          class="field"
          id="symbol"
          required
          maxlength="15"
          placeholder="HAL"
        /><label for="company">Company name</label
        ><input
          class="field"
          id="company"
          required
          placeholder="Hindustan Aeronautics"
        /><label for="target">Alert above price (₹)</label
        ><input
          class="field"
          id="target"
          type="number"
          min="0"
          step="0.05"
          placeholder="5100"
        />
        <div class="dialog-actions">
          <button class="mini" type="button" onclick="closeModal('stockModal')">
            Cancel</button
          ><button class="btn" type="submit">Add stock</button>

    <div class="modal" id="riskModal">
      <form class="dialog" id="riskForm">
        <div class="dialog-head">
          <h3>Risk calculator</h3>
          <button type="button" onclick="closeModal('riskModal')">×</button>
        </div>
        <label>Capital (₹)</label
        ><input class="field" id="capital" type="number" value="500000" /><label
          >Entry / Stop (₹)</label
        >
        <div class="toolbar">
          <input class="field" id="entry" type="number" value="5107" /><input
            class="field"
            id="stop"
            type="number"
            value="4920"
          />
        </div>

        ><input
          class="field"

          step="0.1"

    </div>
    <div class="toast" id="toast"></div>
    <script>
      const K = "alpha-swing-list",
        S = [
          ["HAL", "Hindustan Aeronautics", "₹5,107", "+1.42%", 96],
          ["BEL", "Bharat Electronics", "₹410.20", "+0.86%", 91],
          ["TRENT", "Trent Limited", "₹6,084", "+0.52%", 89],
          ["CGPOWER", "CG Power", "₹835.40", "-0.18%", 82],
          ["COCHINSHIP", "Cochin Shipyard", "₹1,843", "+2.10%", 93],
        ];
      let list =
        JSON.parse(localStorage.getItem(K) || "null") ||
        S.slice(0, 2).map((x) => ({ s: x[0], n: x[1], on: true }));
      let positions = JSON.parse(localStorage.getItem("alpha-paper") || "[]");
      let journalEntries = JSON.parse(
        localStorage.getItem("alpha-journal") || "[]",
      );
      let currentPage = "overview";
      const $ = (x) => document.querySelector(x);
      function title(t, btn = "") {
        return `<div class="title"><div><small>ALPHA SWING · NSE</small><h1>${t}</h1></div>${btn}</div>`;
      }
      function spark(up = true, wide = false) {
        const color = up ? "#12b985" : "#ee7080";
        const points = up
          ? "2,35 18,31 30,34 43,22 57,27 71,16 86,20 101,8 118,12"
          : "2,15 18,18 30,13 43,25 57,22 71,33 86,27 101,37 118,31";
        return `<svg class="${wide ? "hero-line" : "stock-line"}" viewBox="0 0 120 44" role="img" aria-label="${up ? "Rising" : "Falling"} price trend"><polyline points="${points}" fill="none" stroke="${wide ? "rgba(255,255,255,.92)" : color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="118" cy="${up ? 12 : 31}" r="3.5" fill="${wide ? "#fff" : color}"/></svg>`;
      }
      function logo(symbol, down = false) {
        return `<span class="stock-logo ${down ? "rose" : ""}">${symbol.slice(0, 2)}</span>`;
      }
      function rows() {
        return S.map(
          (x) =>
            `<div class="row"><button class="stock-open" onclick="detail('${x[0]}')">${logo(x[0], x[3].startsWith("-"))}<span><b>${x[0]}</b><br><small>${x[1]}</small></span></button><div><b>${x[2]}</b><br><small class="${x[3].startsWith("-") ? "down" : "up"}">${x[3]}</small></div><div><span class="notice">${x[4] > 94 ? "Confirming" : "Armed"}</span></div><button class="mini" aria-label="Add ${x[0]} to watchlist" onclick="quickAdd('${x[0]}','${x[1]}')">＋</button></div>`,
        ).join("");
      }
      function watchPreview() {
        if (!list.length)
          return '<div class="notice">No watched stocks yet. Add a symbol to begin.</div>';
        return list
          .slice(0, 4)
          .map((item) => {
            const stock = S.find((x) => x[0] === item.s) || [
              item.s,
              item.n,
              "₹—",
              "Awaiting feed",
              80,
            ];
            const isDown = String(stock[3]).startsWith("-");
            return `<div class="row"><button class="stock-open" onclick="detail('${item.s}')">${logo(item.s, isDown)}<span><b>${item.s}</b><br><small>${item.n}</small></span></button><div><b>${stock[2]}</b><br><small class="${isDown ? "down" : "up"}">${stock[3]}</small></div><div><span class="notice">${item.on ? "Alert on" : "Alert off"}</span></div><button class="mini" aria-label="Open ${item.s}" onclick="detail('${item.s}')">→</button></div>`;
          })
          .join("");
      }
      function notify(t, b) {
        if (Notification.permission === "granted")
          new Notification(t, { body: b });
        else alert(t + "\\n" + b);
      }
      function save() {
        localStorage.setItem(K, JSON.stringify(list));
      }
      function overview() {
        app.innerHTML =
          title(
            "Good afternoon, Hassain",
            '<button class="btn" onclick="openStockModal()">＋ Add stock</button>',
          ) +
          `<section class="card portfolio-hero"><div class="portfolio-top"><span>PAPER PORTFOLIO</span><span class="live-chip">● Market closed</span></div><div class="portfolio-value"><strong>₹5,00,000</strong><span>+1.74%</span></div><div class="portfolio-stats"><div><small>Today's gain</small><b>₹2,344.11</b></div><div><small>Open risk</small><b>₹0.00</b></div><div><small>Buying power</small><b>₹5,00,000</b></div></div>${spark(true, true)}</section><div class="overview-grid"><div><div class="section-head"><h2>Top setups</h2><button onclick="page('scanner')">View scanner →</button></div><section class="setup-strip">${S.slice(
            0,
            3,
          )
            .map(
              (x) =>
                `<button class="card setup-card" onclick="detail('${x[0]}')">${logo(x[0], x[3].startsWith("-"))}<div class="stock-price">${x[0]} · ${x[2]}</div><small class="${x[3].startsWith("-") ? "down" : "up"}">${x[3]} · Score ${x[4]}</small>${spark(!x[3].startsWith("-"))}</button>`,
            )
            .join(
              "",
            )}</section><div class="section-head"><h2>Watchlist</h2><button onclick="page('watchlist')">Manage →</button></div><div class="rows">${watchPreview()}</div></div><aside class="card market-pulse"><small>MARKET PULSE</small><h3>Selective momentum</h3><div class="pulse-ring"></div><p class="pulse-copy">Three quality names are close to their pivots. Wait for price and volume confirmation.</p><div class="quality-list"><div><span>Nifty 500</span><b class="up">+0.48%</b></div><div><span>India VIX</span><b>12.84</b></div><div><span>Breadth</span><b>62%</b></div></div></aside></div>`;
      }
      function detail(symbol) {
        const saved = list.find((item) => item.s === symbol);
        const x = S.find((item) => item[0] === symbol) || [
          symbol,
          saved?.n || symbol,
          "₹—",
          "0.00%",
          80,
        ];
        const watched = list.some((item) => item.s === x[0]);
        app.innerHTML =
          `<div class="title"><div><small>SELECTED SETUP</small><h1>${x[0]}</h1><span class="muted">${x[1]}</span></div><button class="mini" onclick="page('overview')">← Back</button></div>` +
          `<div class="detail-layout"><section class="card detail-chart"><div style="display:flex;align-items:center;gap:12px">${logo(x[0], x[3].startsWith("-"))}<div><b>${x[0]}</b><br><small class="muted">NSE · Equity</small></div></div><div class="detail-price">${x[2]}</div><div class="${x[3].startsWith("-") ? "down" : "up"}">${x[3]} today</div><div class="range-tabs"><button>1D</button><button>1W</button><button class="active">1M</button><button>1Y</button><button>5Y</button></div><svg class="chart-canvas" viewBox="0 0 650 270" role="img" aria-label="One month candlestick chart"><defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#21cf98" stop-opacity=".22"/><stop offset="1" stop-color="#21cf98" stop-opacity="0"/></linearGradient></defs><g stroke="#e8efeb" stroke-width="1"><line x1="20" y1="40" x2="630" y2="40"/><line x1="20" y1="100" x2="630" y2="100"/><line x1="20" y1="160" x2="630" y2="160"/><line x1="20" y1="220" x2="630" y2="220"/></g><path d="M20 205 C70 190 90 205 130 175 S200 155 230 168 S300 115 340 130 S410 92 450 110 S510 70 545 82 S590 35 630 45 L630 245 L20 245 Z" fill="url(#chartFill)"/><path d="M20 205 C70 190 90 205 130 175 S200 155 230 168 S300 115 340 130 S410 92 450 110 S510 70 545 82 S590 35 630 45" fill="none" stroke="#18bd88" stroke-width="4" stroke-linecap="round"/><circle cx="630" cy="45" r="7" fill="#18bd88" stroke="#fff" stroke-width="4"/></svg><div class="detail-actions"><button class="btn" onclick="prefillPaper('${x[0]}','${x[2].replace(/[^0-9.]/g, "")}')">Paper buy</button><button class="mini" onclick="${watched ? `removeBySymbol('${x[0]}')` : `quickAdd('${x[0]}','${x[1]}')`}">${watched ? "Remove from watchlist" : "Add to watchlist"}</button></div></section><aside class="card detail-aside"><small>SETUP QUALITY</small><h3>${x[4]} / 100 <span class="notice">${x[4] > 94 ? "A+" : "A"}</span></h3><div class="quality-list"><div><span>Trend template</span><b>8 / 8</b></div><div><span>Relative strength</span><b>${Math.max(82, x[4] - 2)}</b></div><div><span>VCP score</span><b>${x[4]}</b></div><div><span>Relative volume</span><b>1.82×</b></div><div><span>Market gate</span><b style="color:#e5a12f">Caution</b></div></div><p class="pulse-copy" style="text-align:left">Paper trading only until the Upstox market-data connection is active.</p></aside></div>`;
        document
          .querySelectorAll("[data-page]")
          .forEach((b) => b.classList.remove("active"));
        mobileMenu.classList.remove("open");
      }
      function prefillPaper(symbol, price) {
        page("paper");
        pSymbol.value = symbol;
        pEntry.value = Number(price) || "";
        pStop.value = price ? (Number(price) * 0.96).toFixed(2) : "";
        pQty.focus();
      }
      function scanner() {
        app.innerHTML =
          title(
            "Scanner",
            '<button class="btn" onclick="exportCsv()">Export CSV</button>',
          ) +
          `<section class="card"><small>QUALIFIED CANDIDATES</small><h3>Nifty 500 scan</h3><div class="toolbar"><input id="scanSearch" placeholder="Search symbol or company" oninput="filterRows(this.value)"><button class="mini" onclick="filterRows('')">Clear</button></div><div class="rows" id="scanRows">${rows()}</div></section>`;
      }
      function watch() {
        app.innerHTML =
          title(
            "Watchlist",
            '<button class="btn" onclick="openStockModal()">＋ Add symbol</button>',
          ) +
          `<section class="card watch"><small>YOUR LIST</small><h3>Price alerts</h3><div id="items">${list.length ? list.map((x, i) => `<div class="watchrow"><button class="stock-open" onclick="detail('${x.s}')">${logo(x.s)}<span><b>${x.s}</b><br><small>${x.n}</small></span></button><label><input type="checkbox" ${x.on ? "checked" : ""} onchange="toggle(${i},this.checked)"> Alert above ₹ <input aria-label="Alert target for ${x.s}" type="number" value="${x.target || 0}" onchange="setTarget(${i},this.value)"></label><button class="remove" onclick="removeItem(${i})">Remove</button></div>`).join("") : '<div class="notice">Your watchlist is empty. Add a symbol to start monitoring it.</div>'}</div><p><button class="btn" onclick="testAlert()">Test alert</button> <button class="mini" onclick="enableAlerts()">Enable browser alerts</button></p></section>`;
      }
      function market() {
        app.innerHTML =
          title("Market health") +
          `<section class="card"><small>MARKET GATE</small><h3>CAUTION</h3><div class="metrics"><div class="metric"><span>Nifty 500</span><b class="up">+0.48%</b></div><div class="metric"><span>Nifty 50</span><b class="up">+0.36%</b></div><div class="metric"><span>India VIX</span><b>12.84</b></div><div class="metric"><span>Breadth</span><b>62%</b></div></div><div class="notice">A/A+ setups only. Reduce risk until the market gate improves.</div></section>`;
      }
      function paper() {
        const invested = positions.reduce((n, p) => n + p.entry * p.qty, 0);
        app.innerHTML =
          title("Paper trading") +
          `<section class="kpi-grid"><div class="card kpi"><small>Open positions</small><b>${positions.length}</b></div><div class="card kpi"><small>Capital deployed</small><b>₹${invested.toLocaleString("en-IN")}</b></div><div class="card kpi"><small>Mode</small><b class="positive">PAPER</b></div></section><section class="card"><h3>New paper position</h3><form class="form-grid" onsubmit="paperBuy(event)"><label>Symbol<input id="pSymbol" required placeholder="HAL"></label><label>Entry price<input id="pEntry" required type="number" step="0.05"></label><label>Stop loss<input id="pStop" required type="number" step="0.05"></label><label>Quantity<input id="pQty" required type="number" min="1"></label><button class="btn full">Paper buy</button></form>${positions.length ? `<table class="table"><tr><th>Symbol</th><th>Entry</th><th>Stop</th><th>Qty</th><th></th></tr>${positions.map((p, i) => `<tr><td><b>${p.symbol}</b></td><td>₹${p.entry}</td><td>₹${p.stop}</td><td>${p.qty}</td><td><button class="remove" onclick="closePaper(${i})">Close</button></td></tr>`).join("")}</table>` : '<div class="notice">No paper positions yet.</div>'}</section>`;
      }
      function paperBuy(e) {
        e.preventDefault();
        const entry = Number(pEntry.value),
          stop = Number(pStop.value);
        if (stop >= entry) return toastMsg("Stop must be below entry");
        positions.push({
          symbol: pSymbol.value.trim().toUpperCase(),
          entry,
          stop,
          qty: Number(pQty.value),
          date: new Date().toISOString(),
        });
        localStorage.setItem("alpha-paper", JSON.stringify(positions));
        paper();
        toastMsg("Paper position opened");
      }
      function closePaper(i) {
        const p = positions.splice(i, 1)[0];
        localStorage.setItem("alpha-paper", JSON.stringify(positions));
        journalEntries.unshift({
          symbol: p.symbol,
          setup: "Paper trade",
          notes: `Closed paper position from ₹${p.entry}`,
          date: new Date().toLocaleDateString("en-IN"),
        });
        localStorage.setItem("alpha-journal", JSON.stringify(journalEntries));
        paper();
        toastMsg("Position closed and journaled");
      }
      function journal() {
        app.innerHTML =
          title("Trade journal") +
          `<section class="card"><h3>Add journal note</h3><form class="form-grid" onsubmit="addJournal(event)"><label>Symbol<input id="jSymbol" required></label><label>Setup<select id="jSetup"><option>VCP</option><option>Breakout</option><option>Pullback</option><option>Darvas box</option></select></label><label class="full">Notes<textarea id="jNotes" required></textarea></label><button class="btn full">Save journal entry</button></form>${journalEntries.length ? `<table class="table"><tr><th>Date</th><th>Symbol</th><th>Setup</th><th>Notes</th><th></th></tr>${journalEntries.map((j, i) => `<tr><td>${j.date}</td><td><b>${j.symbol}</b></td><td><span class="pill">${j.setup}</span></td><td>${j.notes}</td><td><button class="remove" onclick="deleteJournal(${i})">Delete</button></td></tr>`).join("")}</table>` : '<div class="notice">Your journal is empty.</div>'}</section>`;
      }
      function addJournal(e) {
        e.preventDefault();
        journalEntries.unshift({
          symbol: jSymbol.value.trim().toUpperCase(),
          setup: jSetup.value,
          notes: jNotes.value.trim(),
          date: new Date().toLocaleDateString("en-IN"),
        });
        localStorage.setItem("alpha-journal", JSON.stringify(journalEntries));
        journal();
        toastMsg("Journal entry saved");
      }
      function deleteJournal(i) {
        journalEntries.splice(i, 1);
        localStorage.setItem("alpha-journal", JSON.stringify(journalEntries));
        journal();
      }
      function backtest() {
        app.innerHTML =
          title("Backtest") +
          `<section class="card"><h3>Import daily candles</h3><div class="file"><p>CSV columns: date, open, high, low, close, volume</p><input id="csvFile" type="file" accept=".csv"><p><button class="btn" onclick="runBacktest()">Run 20/50 SMA test</button></p></div><div id="backtestResult" class="notice">Import at least 50 daily candles to calculate results locally.</div></section>`;
      }
      async function runBacktest() {
        const f = csvFile.files[0];
        if (!f) return toastMsg("Choose a candle CSV first");
        const rows = (await f.text())
          .trim()
          .split(/\r?\n/)
          .slice(1)
          .map((r) => r.split(","))
          .filter((r) => r.length >= 5)
          .map((r) => Number(r[4]));
        if (rows.length < 50) return toastMsg("At least 50 rows are required");
        let trades = 0,
          wins = 0,
          entry = 0;
        const avg = (i, n) =>
          rows.slice(i - n + 1, i + 1).reduce((a, b) => a + b, 0) / n;
        for (let i = 50; i < rows.length; i++) {
          const fast = avg(i, 20),
            slow = avg(i, 50),
            pf = avg(i - 1, 20),
            ps = avg(i - 1, 50);
          if (!entry && fast > slow && pf <= ps) {
            entry = rows[i];
            trades++;
          } else if (entry && fast < slow && pf >= ps) {
            if (rows[i] > entry) wins++;
            entry = 0;
          }
        }
        backtestResult.innerHTML = `<b>${trades} trades</b> · ${trades ? Math.round((wins / trades) * 100) : 0}% win rate · deterministic 20/50 SMA crossover. Results exclude costs and slippage.`;
      }
      function settings() {
        app.innerHTML =
          title("Settings") +
          `<section class="card settings"><h3>Trading preferences</h3><label>Default risk per trade (%)</label><input id="defaultRisk" type="number" value="${localStorage.getItem("alpha-risk") || 0.5}" step="0.1"><label>Provider status</label><input value="Upstox — configuration required" disabled><p><button class="btn" onclick="saveSettings()">Save preferences</button> <button class="mini" onclick="openModal('riskModal')">Open risk calculator</button></p></section>`;
      }
      function openModal(id) {
        document.getElementById(id).classList.add("open");
      }
      function closeModal(id) {
        document.getElementById(id).classList.remove("open");
      }
      function openStockModal() {
        stockForm.reset();
        openModal("stockModal");
        symbol.focus();
      }
      function quickAdd(s, n) {
        if (list.some((x) => x.s === s))
          return toastMsg(s + " is already watched");
        list.push({ s, n, on: true, target: 0 });
        save();
        toastMsg(s + " added to watchlist");
      }
      function toastMsg(message) {
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2200);
      }
      stockForm.onsubmit = (event) => {
        event.preventDefault();
        const s = symbol.value.trim().toUpperCase();
        if (list.some((x) => x.s === s))
          return toastMsg("Stock already exists");
        list.push({
          s,
          n: company.value.trim(),
          on: true,
          target: Number(target.value) || 0,
        });
        localStorage.setItem(K, JSON.stringify(list));
        closeModal("stockModal");
        if (currentPage === "watchlist") watch();
        if (currentPage === "overview") overview();
        toastMsg(s + " added to watchlist");
      };
      function setTarget(i, value) {
        list[i].target = Number(value) || 0;
        localStorage.setItem(K, JSON.stringify(list));
        toastMsg("Alert price saved");
      }
      function removeItem(i) {
        list.splice(i, 1);
        save();
        watch();
        toastMsg("Stock removed from watchlist");
      }
      function removeBySymbol(symbol) {
        const i = list.findIndex((item) => item.s === symbol);
        if (i >= 0) list.splice(i, 1);
        save();
        detail(symbol);
        toastMsg(symbol + " removed from watchlist");
      }
      function toggle(i, v) {
        list[i].on = v;
        save();
        notify(
          "Alerts updated",
          list[i].s + " alerts " + (v ? "enabled" : "disabled") + ".",
        );
      }
      async function enableAlerts() {
        let r = await Notification.requestPermission();
        notify(
          "Browser alerts",
          r === "granted"
            ? "Enabled on this device."
            : "Permission not granted.",
        );
      }
      function testAlert() {
        notify(
          "Alpha Swing AI",
          "Test alert: browser notifications are working.",
        );
      }
      function filterRows(query) {
        const q = query.toLowerCase();
        document
          .querySelectorAll("#scanRows .row")
          .forEach(
            (row) =>
              (row.style.display = row.textContent.toLowerCase().includes(q)
                ? "grid"
                : "none"),
          );
      }
      function exportCsv() {
        const lines = [["Symbol", "Company", "Price", "Change", "Score"], ...S]
          .map((r) => r.map((v) => `"${v}"`).join(","))
          .join("\n");
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([lines], { type: "text/csv" }));
        a.download = "alpha-swing-scanner.csv";
        a.click();
        URL.revokeObjectURL(a.href);
        toastMsg("Scanner CSV downloaded");
      }
      function saveSettings() {
        localStorage.setItem("alpha-risk", defaultRisk.value);
        toastMsg("Preferences saved");
      }
      riskForm.onsubmit = (event) => {
        event.preventDefault();
        const c = Number(capital.value),
          e = Number(entry.value),
          s = Number(stop.value),
          p = Number(riskPct.value),
          r = e - s,
          q = r > 0 ? Math.floor((c * p) / 100 / r) : 0;
        riskResult.innerHTML = `<span>Risk amount<b>₹${((c * p) / 100).toLocaleString("en-IN")}</b></span><span>Quantity<b>${q}</b></span><span>Position value<b>₹${(q * e).toLocaleString("en-IN")}</b></span><span>2R target<b>₹${(e + 2 * r).toLocaleString("en-IN")}</b></span>`;
      };
      function page(x) {
        currentPage = x;
        ({
          overview,
          scanner,
          watchlist: watch,
          market,
          paper,
          journal,
          backtest,
          settings,
        })[x]();
        mobileMenu.classList.remove("open");
        document
          .querySelectorAll("[data-page]")
          .forEach((b) => b.classList.toggle("active", b.dataset.page === x));
        moreButton.classList.toggle(
          "active",
          ["market", "journal", "backtest", "settings"].includes(x),
        );
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      function toggleMobileMenu() {
        mobileMenu.classList.toggle("open");
        moreButton.classList.toggle(
          "active",
          mobileMenu.classList.contains("open"),
        );
      }
      document
        .querySelectorAll("[data-page]")
        .forEach((b) => (b.onclick = () => page(b.dataset.page)));
      page("overview");
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("sw.js");
    </script>
  </body>
</html>
