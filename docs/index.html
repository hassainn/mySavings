<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Alpha Swing AI</title>
    <meta name="theme-color" content="#f3f7f5" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
    />
    <style>
      :root {
        --bg: #0e1722;
        --side: #09111a;
        --card: #152232;
        --line: #2b4059;
        --gold: #dfb65f;
        --ink: #ecf2fb;
        --muted: #91a6c0;
        --green: #5ed0a4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px Arial,
          sans-serif;
      }
      .app {
        display: flex;
        min-height: 100vh;
      }
      .side {
        width: 250px;
        background: var(--side);
        border-right: 1px solid var(--line);
        padding: 25px 14px;
      }
      .brand {
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 2px;
        color: #fff;
        padding: 8px;
      }
      .brand b {
        color: var(--gold);
      }
      .side p {
        font-size: 11px;
        letter-spacing: 2px;
        color: var(--muted);
        margin: 42px 8px 10px;
      }
      .nav {
        width: 100%;
        background: none;
        border: 0;
        color: #a9bdd3;
        text-align: left;
        padding: 13px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
      }
      .nav:hover,
      .nav.active {
        background: #203249;
        color: #fff;
        box-shadow: inset 2px 0 var(--gold);
      }
      .main {
        flex: 1;
        min-width: 0;
      }
      .top {
        height: 82px;
        border-bottom: 1px solid var(--line);
        padding: 0 45px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .status {
        color: var(--gold);
        font-family: monospace;
      }
      .status span {
        color: var(--muted);
        margin-left: 12px;
      }
      .avatar {
        background: #315778;
        border-radius: 50%;
        width: 39px;
        height: 39px;
        display: grid;
        place-items: center;
        font-weight: bold;
      }
      .wrap {
        max-width: 1500px;
        margin: auto;
        padding: 38px 45px 85px;
      }
      .title {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 28px;
      }
      .title small,
      .eyebrow {
        color: #94aaca;
        letter-spacing: 2px;
        font-size: 10px;
      }
      .title h1 {
        font:
          600 42px Georgia,
          serif;
        margin: 8px 0 0;
      }
      .btn {
        background: var(--gold);
        border: 0;
        border-radius: 6px;
        padding: 12px 16px;
        font-weight: bold;
        color: #101923;
        cursor: pointer;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 20px;
      }
      .verdict {
        display: flex;
        gap: 34px;
        align-items: center;
      }
      .gate {
        padding-right: 34px;
        border-right: 1px solid var(--line);
        min-width: 165px;
      }
      .gate b {
        display: block;
        color: var(--gold);
        font: 18px monospace;
        margin: 8px 0;
      }
      .gate span {
        color: var(--muted);
      }
      h2 {
        font-size: 18px;
        margin: 6px 0;
      }
      h3 {
        font:
          24px Georgia,
          serif;
        margin: 5px 0;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin: 18px 0;
      }
      .metric {
        border-top: 2px solid #5288be;
      }
      .metric b {
        display: block;
        font:
          36px Georgia,
          serif;
        margin: 8px 0;
      }
      .metric span {
        color: var(--muted);
        font-size: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 315px;
        gap: 17px;
      }
      .rows {
        margin: 16px -20px -20px;
      }
      .row {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 0.5fr;
        gap: 12px;
        padding: 15px 20px;
        border-top: 1px solid var(--line);
        align-items: center;
      }
      .row small,
      .muted {
        color: var(--muted);
      }
      .up {
        color: var(--green);
      }
      .score {
        text-align: center;
        border: 5px solid #4c85a9;
        border-top-color: var(--gold);
        border-radius: 50%;
        width: 104px;
        height: 104px;
        margin: 20px auto;
        display: grid;
        place-content: center;
        font: 37px Georgia;
      }
      .quality {
        display: grid;
        gap: 11px;
      }
      .quality div {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
      }
      .quality b {
        color: white;
      }
      .watch {
        margin-top: 18px;
      }
      .watchrow {
        display: grid;
        grid-template-columns: 2fr 1fr auto;
        gap: 12px;
        padding: 14px 0;
        border-top: 1px solid var(--line);
        align-items: center;
      }
      .watchrow label {
        color: #a8cef7;
      }
      .remove {
        background: none;
        border: 1px solid #86535c;
        color: #f4a1a8;
        border-radius: 4px;
        padding: 7px;
        cursor: pointer;
      }
      .notice {
        padding: 12px;
        margin: 12px 0;
        border: 1px solid #476580;
        border-radius: 5px;
        background: #182b3e;
        color: #bbd5f1;
      }
      .settings input {
        display: block;
        width: 100%;
        margin: 8px 0 16px;
        padding: 11px;
        background: #0d1620;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: white;
      }
      .hidden {
        display: none;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        margin: 14px 0;
      }
      .toolbar input,
      .field {
        width: 100%;
        padding: 11px;
        background: #0d1620;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: white;
      }
      .mini {
        border: 1px solid #46617e;
        background: transparent;
        color: #b9cee5;
        border-radius: 4px;
        padding: 7px 9px;
        cursor: pointer;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: #05090fbb;
        display: none;
        place-items: center;
        z-index: 20;
        padding: 16px;
      }
      .modal.open {
        display: grid;
      }
      .dialog {
        width: min(480px, 100%);
        background: #152232;
        border: 1px solid #49627e;
        border-radius: 9px;
        padding: 22px;
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
      }
      .dialog-head button {
        background: none;
        border: 0;
        color: white;
        font-size: 22px;
      }
      .dialog label {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin: 12px 0 5px;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }
      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        background: #20364c;
        border: 1px solid #4b6b8b;
        padding: 12px 16px;
        border-radius: 6px;
        display: none;
        z-index: 30;
      }
      .toast.show {
        display: block;
      }
      .risk-result {
        margin-top: 15px;
        padding: 14px;
        background: #0e1925;
        border-radius: 6px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .risk-result span {
        color: var(--muted);
        font-size: 12px;
      }
      .risk-result b {
        display: block;
        color: white;
        margin-top: 3px;
      }
      .danger {
        color: #f2a1a8;
      }
      .watchrow input[type="number"] {
        width: 100px;
        padding: 7px;
        background: #0d1620;
        border: 1px solid var(--line);
        color: white;
        border-radius: 4px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .form-grid label {
        color: var(--muted);
        font-size: 12px;
      }
      .form-grid input,
      .form-grid select,
      .form-grid textarea {
        display: block;
        width: 100%;
        margin-top: 5px;
        padding: 10px;
        background: #0d1620;
        border: 1px solid var(--line);
        border-radius: 5px;
        color: white;
      }
      .form-grid textarea {
        min-height: 85px;
      }
      .full {
        grid-column: 1/-1;
      }
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 14px 0;
      }
      .kpi {
        padding: 15px;
        background: #0f1b28;
        border-radius: 6px;
      }
      .kpi b {
        display: block;
        font-size: 24px;
        margin-top: 5px;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 14px;
      }
      .table th,
      .table td {
        text-align: left;
        border-top: 1px solid var(--line);
        padding: 12px 8px;
      }
      .table th {
        color: var(--muted);
        font-size: 11px;
      }
      .pill {
        padding: 4px 7px;
        border-radius: 4px;
        background: #243d56;
        color: #abd4ff;
        font-size: 11px;
      }
      .file {
        padding: 18px;
        border: 1px dashed #49627e;
        border-radius: 7px;
        text-align: center;
      }
      .positive {
        color: var(--green);
      }
      .mobile {
        display: none;
      }
      @media (max-width: 720px) {
        .side {
          display: none;
        }
        .top {
          height: 62px;
          padding: 0 18px;
        }
        .wrap {
          padding: 25px 15px 75px;
        }
        .title h1 {
          font-size: 34px;
        }
        .metrics {
          grid-template-columns: repeat(2, 1fr);
          gap: 9px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .focus {
          display: none;
        }
        .verdict {
          display: block;
        }
        .gate {
          border: 0;
          border-bottom: 1px solid var(--line);
          padding-bottom: 12px;
          margin-bottom: 14px;
        }
        .row {
          grid-template-columns: 2fr 1fr;
        }
        .row > :nth-child(3),
        .row > :nth-child(4) {
          display: none;
        }
        .watchrow {
          grid-template-columns: 1fr auto;
        }
        .watchrow label {
          grid-column: 1;
        }
        .watchrow button {
          grid-column: 2;
          grid-row: 1/3;
        }
        .form-grid,
        .kpi-grid {
          grid-template-columns: 1fr;
        }
        .table {
          font-size: 12px;
        }
        .table th:nth-child(3),
        .table td:nth-child(3) {
          display: none;
        }
        .mobile {
          display: flex;
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          height: 62px;
          background: var(--side);
          border-top: 1px solid var(--line);
          justify-content: space-around;
          overflow-x: auto;
        }
        .mobile button {
          border: 0;
          background: none;
          color: var(--muted);
          font-size: 11px;
          min-width: 76px;
        }
        .mobile button.active {
          color: var(--gold);
        }
      }
    </style>
    <style id="mint-mobile-redesign">
      :root {

    <script src="strategist.js"></script>
    <script>
      const K = "alpha-swing-list",
        S = [
          ["HAL", "Hindustan Aeronautics", "₹5,107", "+1.42%", 96],
          ["BEL", "Bharat Electronics", "₹410.20", "+0.86%", 91],
          ["TRENT", "Trent Limited", "₹6,084", "+0.52%", 89],
          ["CGPOWER", "CG Power", "₹835.40", "-0.18%", 82],
          ["COCHINSHIP", "Cochin Shipyard", "₹1,843", "+2.10%", 93],
        ];
      let list =
        JSON.parse(localStorage.getItem(K) || "null") ||
        S.slice(0, 2).map((x) => ({ s: x[0], n: x[1], on: true }));
      let positions = JSON.parse(localStorage.getItem("alpha-paper") || "[]");
      let journalEntries = JSON.parse(
        localStorage.getItem("alpha-journal") || "[]",
      );
      let currentPage = "overview";
      let marketIntel = null;
      let newsFilter = "all";
      let intelLoading = false;
      let scanFeed = null;
      let scanLoading = false;
      let scanSearch = "";
      let scanStrategy = "all";
      let scanThreshold = Number(localStorage.getItem("alpha-scan-threshold") || 65);
      let voiceEnabled = localStorage.getItem("alpha-voice-alerts") === "on";
      const DATA_ROOT =
        location.hostname === "hassainn.github.io" ||
        location.hostname === "localhost" ||
        location.hostname === "127.0.0.1" ||
        location.protocol === "file:"
          ? "data"
          : "https://raw.githubusercontent.com/hassainn/mySavings/main/docs/data";
      const $ = (x) => document.querySelector(x);
      function escapeHTML(value = "") {
        return String(value).replace(
          /[&<>'"]/g,
          (character) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[character],
        );
      }
      function safeUrl(value = "") {
        try {
          const parsed = new URL(value);
          return parsed.protocol === "https:" ? parsed.href : "";
        } catch {
          return "";
        }
      }
      function intelStatus() {
        if (marketIntel?.status !== "live") return "Setup preview";
        return (
          {
            "gemini-grounded": "Live · AI + Search",
            "rss-gemini": "Live · AI ranked",
            "rss-deterministic": "Live · headlines",
          }[marketIntel.method] || "Live"
        );
      }
      function intelSourceLabel() {
        return (
          {
            "gemini-grounded": "GEMINI 3.8 FLASH",
            "rss-gemini": "RSS + GEMINI",
            "rss-deterministic": "INDIAN MARKET RSS",
          }[marketIntel?.method] || "MARKET INTELLIGENCE"
        );
      }
      function formatPublished(value) {
        if (!value) return "Awaiting live refresh";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return escapeHTML(value);
        return date.toLocaleString("en-IN", {
          day: "numeric",
          month: "short",
          hour: "numeric",
          minute: "2-digit",
        });
      }
      async function loadIntelligence(force = false) {
        if (intelLoading) return;
        intelLoading = true;
        try {
          const suffix = force ? `?refresh=${Date.now()}` : "";
          const response = await fetch(
            `${DATA_ROOT}/market-intelligence.json${suffix}`,
            {
              cache: "no-store",
            },
          );
          if (!response.ok) throw new Error("Market feed unavailable");
          marketIntel = await response.json();
          if (currentPage === "overview") overview();
          if (currentPage === "news") news();
        } catch {
          marketIntel = {
            status: "error",

      async function runBacktest() {
        const f = csvFile.files[0];
        if (!f) return toastMsg("Choose a candle CSV first");
        const rows = (await f.text())
          .trim()
          .split(/\r?\n/)
          .slice(1)
          .map((r) => r.split(","))
          .filter((r) => r.length >= 5)
          .map((r) => Number(r[4]));
        if (rows.length < 50) return toastMsg("At least 50 rows are required");
        let trades = 0,
          wins = 0,
          entry = 0;
        const avg = (i, n) =>
          rows.slice(i - n + 1, i + 1).reduce((a, b) => a + b, 0) / n;
        for (let i = 50; i < rows.length; i++) {
          const fast = avg(i, 20),
            slow = avg(i, 50),
            pf = avg(i - 1, 20),
            ps = avg(i - 1, 50);
          if (!entry && fast > slow && pf <= ps) {
            entry = rows[i];
            trades++;
          } else if (entry && fast < slow && pf >= ps) {
            if (rows[i] > entry) wins++;
            entry = 0;
          }
        }
        backtestResult.innerHTML = `<b>${trades} trades</b> · ${trades ? Math.round((wins / trades) * 100) : 0}% win rate · deterministic 20/50 SMA crossover. Results exclude costs and slippage.`;

          e = Number(entry.value),
          s = Number(stop.value),
          p = Number(riskPct.value),
          r = e - s,
          q = r > 0 ? Math.floor((c * p) / 100 / r) : 0;
        riskResult.innerHTML = `<span>Risk amount<b>₹${((c * p) / 100).toLocaleString("en-IN")}</b></span><span>Quantity<b>${q}</b></span><span>Position value<b>₹${(q * e).toLocaleString("en-IN")}</b></span><span>2R target<b>₹${(e + 2 * r).toLocaleString("en-IN")}</b></span>`;
      };
      function page(x) {
        currentPage = x;
        ({
          overview,
          strategist,
          scanner,
          watchlist: watch,
          market,
          news,
          paper,
          journal,
          backtest,
          settings,
        })[x]();
        mobileMenu.classList.remove("open");
        document
          .querySelectorAll("[data-page]")
          .forEach((b) => b.classList.toggle("active", b.dataset.page === x));
        moreButton.classList.toggle(
          "active",
          ["strategist", "news", "market", "journal", "backtest", "settings"].includes(x),
        );
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      function toggleMobileMenu() {
        mobileMenu.classList.toggle("open");
        moreButton.classList.toggle(
          "active",
          mobileMenu.classList.contains("open"),
        );
      }
      document
        .querySelectorAll("[data-page]")
        .forEach((b) => (b.onclick = () => page(b.dataset.page)));
      page("overview");
      loadIntelligence();
      loadAgenticScan();
      loadStrategist();
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("sw.js");
    </script>
  </body>
</html>
